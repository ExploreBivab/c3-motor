<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ESP32C3 BLE Motor Control</title>

<style>

body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f4f4f4;
    margin-top:40px;
}

h1{
    color:#333;
}

button{
    width:220px;
    height:70px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:20px;
    color:white;
    cursor:pointer;
}

.connect{
    background:#3498db;
}

.forward{
    background:#2ecc71;
}

.reverse{
    background:#f39c12;
}

.stop{
    background:#e74c3c;
}

#status{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>ESP32 BLE Motor Control</h1>

<button class="connect"
onclick="connectBLE()">
Connect ESP32
</button>

<br><br>

<button class="forward"
onclick="sendCommand('F')">
Forward
</button>

<button class="reverse"
onclick="sendCommand('R')">
Reverse
</button>

<br>

<button class="forward"
onclick="sendCommand('F5')">
Forward 5 Seconds
</button>

<button class="reverse"
onclick="sendCommand('R5')">
Reverse 5 Seconds
</button>

<br>

<button class="stop"
onclick="sendCommand('S')">
STOP
</button>

<div id="status">
Disconnected
</div>

<script>

let characteristic = null;

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-cba987654321";

async function connectBLE(){

    if(!navigator.bluetooth){

        alert(
            "Web Bluetooth is not supported in this browser."
        );

        return;
    }

    try{

        document.getElementById("status").innerHTML =
        "Searching for ESP32...";

        const device =
        await navigator.bluetooth.requestDevice({

            filters:[
                {
                    name:"ESP32C3_MOTOR"
                }
            ],

            optionalServices:[
                SERVICE_UUID
            ]

        });

        document.getElementById("status").innerHTML =
        "Connecting...";

        const server =
        await device.gatt.connect();

        const service =
        await server.getPrimaryService(
            SERVICE_UUID
        );

        characteristic =
        await service.getCharacteristic(
            CHARACTERISTIC_UUID
        );

        document.getElementById("status").innerHTML =
        "Connected to "
        + (device.name || "ESP32");

    }

    catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
        "Connection failed";

        alert(error.message);

    }

}

async function sendCommand(cmd){

    if(!characteristic){

        alert(
            "Connect ESP32 first"
        );

        return;
    }

    try{

        const encoder =
        new TextEncoder();

        await characteristic.writeValue(
            encoder.encode(cmd)
        );

        document.getElementById("status").innerHTML =
        "Command sent: "
        + cmd;

    }

    catch(error){

        console.error(error);

        alert(error.message);

    }

}

</script>

</body>

</html>
