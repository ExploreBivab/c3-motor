<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motor Controller</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f4f4;
    margin: 40px;
}

h1 {
    color: #333;
}

button {
    width: 220px;
    height: 70px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    color: white;
    cursor: pointer;
}

.connect {
    background: #3498db;
}

.forward {
    background: #2ecc71;
}

.reverse {
    background: #f39c12;
}

.stop {
    background: #e74c3c;
}

#status {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>

</head>

<body>

<h1>ESP32 BLE Motor Control</h1>

<button class="connect" id="connectBtn">
    Connect ESP32
</button>

<br><br>

<button class="forward" id="forwardBtn">
    Forward
</button>

<button class="reverse" id="reverseBtn">
    Reverse
</button>

<br>

<button class="forward" id="forward5Btn">
    Forward 5 Seconds
</button>

<button class="reverse" id="reverse5Btn">
    Reverse 5 Seconds
</button>

<br>

<button class="stop" id="stopBtn">
    STOP
</button>

<div id="status">
    Disconnected
</div>

<script>

let characteristic = null;

const SERVICE_UUID =
    "12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
    "87654321-4321-4321-4321-cba987654321";

const statusDiv =
    document.getElementById("status");

async function connectBLE() {

    if (!navigator.bluetooth) {

        alert("Web Bluetooth is not supported.");

        return;
    }

    try {

        statusDiv.textContent =
            "Select your ESP32 device...";

        const device =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    SERVICE_UUID
                ]

            });

        statusDiv.textContent =
            "Connecting...";

        const server =
            await device.gatt.connect();

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );

        statusDiv.textContent =
            "Connected: " +
            (device.name || "ESP32");

    }

    catch (error) {

        console.error(error);

        statusDiv.textContent =
            "Connection failed";

        alert(error.message);

    }

}

async function sendCommand(command) {

    if (!characteristic) {

        alert("Connect ESP32 first.");

        return;
    }

    try {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(command);

        await characteristic.writeValue(data);

        statusDiv.textContent =
            "Command sent: " + command;

    }

    catch (error) {

        console.error(error);

        alert(error.message);

    }

}

document.getElementById("connectBtn")
    .addEventListener("click", connectBLE);

document.getElementById("forwardBtn")
    .addEventListener("click",
        () => sendCommand("F"));

document.getElementById("reverseBtn")
    .addEventListener("click",
        () => sendCommand("R"));

document.getElementById("forward5Btn")
    .addEventListener("click",
        () => sendCommand("F5"));

document.getElementById("reverse5Btn")
    .addEventListener("click",
        () => sendCommand("R5"));

document.getElementById("stopBtn")
    .addEventListener("click",
        () => sendCommand("S"));

</script>

</body>
</html>
