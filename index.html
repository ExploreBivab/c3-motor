<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32-C3 Motor Control</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#111827;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
    background:#1f2937;
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

h1{
    margin-top:0;
    font-size:25px;
}

.statusBox{
    background:#111827;
    border-radius:12px;
    padding:15px;
    margin:20px 0;
}

.statusLabel{
    font-size:14px;
    color:#9ca3af;
}

#connectionStatus{
    font-size:19px;
    font-weight:bold;
    color:#ef4444;
}

.connected{
    color:#22c55e !important;
}

.motorState{
    font-size:25px;
    font-weight:bold;
    margin-top:20px;
}

.timer{
    font-size:18px;
    color:#9ca3af;
    margin:10px 0 20px;
}

button{
    width:100%;
    height:62px;
    margin:8px 0;
    border:none;
    border-radius:13px;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#connectButton{
    background:#2563eb;
}

#forwardButton{
    background:#16a34a;
}

#reverseButton{
    background:#f59e0b;
}

#stopButton{
    background:#dc2626;
}

.device{
    margin-top:15px;
    font-size:14px;
    color:#9ca3af;
}

.log{
    margin-top:20px;
    padding:10px;
    background:#111827;
    border-radius:10px;
    font-size:12px;
    color:#9ca3af;
    text-align:left;
    min-height:50px;
    word-break:break-word;
}

</style>
</head>

<body>

<div class="container">

<h1>ESP32-C3 Motor Control</h1>

<div class="statusBox">
<div class="statusLabel">BLE STATUS</div>
<div id="connectionStatus">DISCONNECTED</div>
</div>

<button id="connectButton">
CONNECT BLE
</button>

<div class="device" id="deviceName">
No device connected
</div>

<div class="motorState" id="motorState">
STOPPED
</div>

<div class="timer" id="timer">
Ready
</div>

<button id="forwardButton" disabled>
FORWARD
</button>

<button id="reverseButton" disabled>
REVERSE
</button>

<button id="stopButton" disabled>
STOP
</button>

<div class="log" id="log">
Waiting...
</div>

</div>

<script>

const SERVICE_UUID =

const CHARACTERISTIC_UUID =

document.getElementById("connectButton");

{
    const time =
    new Date().toLocaleTimeString();

    log.textContent =
    "[" + time + "] " + message;

    console.log(message);

{
    forwardButton.disabled = !enabled;
    reverseButton.disabled = !enabled;
    stopButton.disabled = !enabled;
}

                {
                    services:[SERVICE_UUID]
                }
            ],
            optionalServices:[
                SERVICE_UUID
            ]
        });

        "Device: " +
        (bluetoothDevice.name || "ESP32");

        handleDisconnect
        );

        connectionStatus.textContent =

        writeLog(
        "Connecting..."
        );

        const server =
        await bluetoothDevice.gatt.connect();

        const service =
        await server.getPrimaryService(
        SERVICE_UUID
        );

        motorCharacteristic =
        await service.getCharacteristic(
        CHARACTERISTIC_UUID
        );

        await new Promise(
            resolve => setTimeout(resolve,200)
        );

        connectionStatus.textContent =
        "CONNECTED";

        connectionStatus.classList.add(
        "connected"
        );

        connectButton.textContent =
        "CONNECTED";

        setMotorButtons(true);

        writeLog(
        "BLE Connected Successfully"
        );
    }
    catch(error)
    {
        connectionStatus.textContent =
        "DISCONNECTED";

        connectionStatus.classList.remove(
        "connected"
        );

        setMotorButtons(false);

        writeLog(
        "Error: " + error.message
        );
