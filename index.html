<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ESP32 Motor BLE Control</title>

<style>

body{
    font-family:Arial;
    text-align:center;
    margin-top:40px;
}

button{
    width:200px;
    height:70px;
    font-size:20px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.connect{
    background:#3498db;
    color:white;
}

.forward{
    background:#2ecc71;
    color:white;
}

.reverse{
    background:#f39c12;
    color:white;
}

.stop{
    background:#e74c3c;
    color:white;
}

</style>
</head>

<body>

<h1>ESP32 BLE Motor Control</h1>

<button class="connect" onclick="connectBLE()">
Connect ESP32
</button>

<br><br>

<button class="forward"
onclick="sendCmd('F')">
Forward
</button>

<button class="reverse"
onclick="sendCmd('R')">
Reverse
</button>

<br><br>

<button class="forward"
onclick="sendCmd('F5')">
Forward 5 Seconds
</button>

<button class="reverse"
onclick="sendCmd('R5')">
Reverse 5 Seconds
</button>

<br><br>

<button class="stop"
onclick="sendCmd('S')">
STOP
</button>

<h3 id="status">Disconnected</h3>

<script>

let characteristic;

const SERVICE_UUID =
"12345678-1234-1234-1234-123456789abc";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-cba987654321";

async function connectBLE(){

    try{

        const device =
        await navigator.bluetooth.requestDevice({
            filters: [{
                services:[SERVICE_UUID]
            }]
        });

        const server =
        await device.gatt.connect();

        const service =
        await server.getPrimaryService(
            SERVICE_UUID
        );

        characteristic =
        await service.getCharacteristic(
            CHARACTERISTIC_UUID
        );

        document.getElementById("status").innerHTML =
        "✅ Connected to " + device.name;

    }

    catch(err){
        alert("Connection Failed");
        console.log(err);
    }
}

async function sendCmd(cmd){

    if(!characteristic){
        alert("Connect ESP32 first");
        return;
    }

    const encoder = new TextEncoder();

    await characteristic.writeValue(
        encoder.encode(cmd)
    );
}

</script>

</body>
</html>
